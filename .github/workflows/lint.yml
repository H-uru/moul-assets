name: Lint
on: [push, pull_request]

jobs:
  check-eol:
    name: Check Line Endings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Check EOL
        run: |
          echo "::add-matcher::.github/lint_matchers.json"
          python eol.py
